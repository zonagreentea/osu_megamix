addEventListener('keydown',e=>{if(['Space','ArrowLeft','ArrowRight','Escape'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.repeat)return;if(e.code==='Escape'){pause();return}if(state!=='play')return;if((mode==='megamix'?activeStyle():mode)==='osu'&&['KeyZ','KeyX','Space'].includes(e.code)){const n=nearest(q=>noteStyle(q)==='osu'?Math.abs(q.at-elapsed):Infinity);if(n&&Math.abs(n.at-elapsed)<.19)judge(n,elapsed-n.at)}if((mode==='megamix'?activeStyle():mode)==='taiko'&&['KeyF','KeyJ','Space'].includes(e.code))hit(W*.26,H*.52);if((mode==='megamix'?activeStyle():mode)==='mania'){const lane={KeyD:0,KeyF:1,KeyJ:2,KeyK:3}[e.code];if(lane!==undefined)hit(0,0,lane)}});addEventListener('keyup',e=>keys.delete(e.code));addEventListener('blur',()=>{keys.clear();if(state==='play')pause()});
function circle(x,y,r,c,alpha=1){ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=c;ctx.fill();ctx.globalAlpha=1}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);if((mode==='megamix'?activeStyle():mode)==='osu'){const f=osuField();ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.strokeRect(f.left,f.top,512*f.scale,384*f.scale)}
if((mode==='megamix'?activeStyle():mode)==='taiko'){ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.arc(W*.26,H*.52,51,0,Math.PI*2);ctx.stroke()}
if((mode==='megamix'?activeStyle():mode)==='mania'){const gap=Math.min(W*.12,85);for(let i=0;i<4;i++){const x=W*.5+(i-1.5)*gap;ctx.fillStyle=i%2?'#fff':'#000';ctx.fillRect(x-gap*.49,0,gap*.98,H);ctx.fillStyle=i%2?'#000':'#fff';ctx.fillRect(x-gap*.47,H*.79,gap*.94,8)}}
if((mode==='megamix'?activeStyle():mode)==='catch'){ctx.fillStyle='#000';ctx.fillRect(0,H*.86,W,2);ctx.fillStyle='#000';ctx.beginPath();ctx.rect(catchX*W-42,H*.82,84,19);ctx.fill()}
for(const n of notes){if(n.dead||(mode==='megamix'&&noteStyle(n)!==activeStyle()))continue;const p=pos(n);if(noteStyle(n)==='osu'){const remaining=n.at-elapsed,radius=osuRadius();
 ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.beginPath();ctx.arc(p.x,p.y,radius+Math.max(0,remaining)*24,0,Math.PI*2);ctx.stroke();
 ctx.fillStyle='#000';ctx.beginPath();ctx.arc(p.x,p.y,radius,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.stroke();
 ctx.fillStyle='#fff';ctx.font='bold '+Math.round(radius*.76)+'px Arial';ctx.textAlign='center';ctx.textBaseline='alphabetic';
 const label=String(n.number),metrics=ctx.measureText(label),offset=(metrics.actualBoundingBoxAscent-metrics.actualBoundingBoxDescent)/2;
 ctx.fillText(label,p.x,p.y+offset)}else if(noteStyle(n)==='taiko'){circle(p.x,p.y,27,'#000')}else if(noteStyle(n)==='catch'){circle(p.x,p.y,17,'#000')}else{const gap=Math.min(W*.12,85);ctx.fillStyle='#000';ctx.beginPath();ctx.rect(p.x-gap*.42,p.y-14,gap*.84,28);ctx.fill()}}
if(flashLife>0){ctx.textAlign='center';ctx.font='bold 18px Arial';ctx.fillStyle='#000';ctx.fillText(flash,W*.5,H*.32)}}
function frame(t){
 sampleMic(t);
 const dt=Math.min((t-last)/1000||0,.05);last=t;
 if(state==='play'){
  elapsed+=dt;spawn+=dt;beat+=dt;
  syncClock(dt);
  if(mode==='megamix'&&Math.floor(Math.max(0,clockBeats)/8)!==megamixSection){
   megamixSection=Math.floor(Math.max(0,clockBeats)/8);
   nextMegamixStyle();notes=[];particles=[];flash='';flashLife=0;
   demoSection=-1;demoMap=[];osuSequence=0;update();
  }
  scheduleBeats();
  if((mode==='megamix'?activeStyle():mode)==='catch'){if(keys.has('ArrowLeft')||keys.has('KeyA'))catchX-=dt*.8;if(keys.has('ArrowRight')||keys.has('KeyD'))catchX+=dt*.8;catchX=Math.max(.06,Math.min(.94,catchX))}for(const n of notes){if(n.dead)continue;if(noteStyle(n)==='catch'&&elapsed>=n.at){judge(n,Math.abs(n.x-catchX)<.09?0:1)}else if(elapsed>n.at+.22)judge(n,1)}notes=notes.filter(n=>!n.dead);flashLife=Math.max(0,flashLife-dt);for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}particles=particles.filter(p=>p.life>0)}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script></body></html>
