(()=>{'use strict';

function stopMic(){
 if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
 if(micSource){try{micSource.disconnect()}catch(e){}micSource=null}

async function toggleMic(){

function sampleMic(now){

  const current=Math.pow(10,Math.max(-100,micSpectrum[i])/20);

  flux+=Math.max(0,current-previous);

   if(gap>=250&&gap<=1200)intervals.push(gap);
  }

   const ordered=[...intervals].sort((a,b)=>a-b),candidate=ordered[Math.floor(ordered.length/2)];

  micOnsets=[];micBpm=0;$('micBpm').textContent='Listening';

const styles=['osu','taiko','catch','mania'];let megamixStyle='osu',megamixSection=0;function nextMegamixStyle(){const choices=styles.filter(style=>style!==megamixStyle);megamixStyle=choices[Math.floor(Math.random()*choices.length)]}function activeStyle(){return megamixStyle}function noteStyle(n){return n.kind||mode}let osuSequence=0;function reset(){osuSequence=0;demoCursor=0;demoSection=-1;demoMap=[];megamixSection=0;megamixStyle=styles[Math.floor(Math.random()*styles.length)];notes=[];particles=[];score=combo=hits=judged=elapsed=spawn=beat=0;hp=100;accuracy=100;flash='';catchX=.5;nextId=0;update()}
function update(){ $('score').textContent=String(score).padStart(7,'0');$('combo').textContent=combo+' COMBO';$('health').style.width=hp+'%';$('accuracy').textContent=accuracy.toFixed(2)+'% ACC';$('modeLabel').textContent=mode==='megamix'?'✦ MEGAMIX / '+activeStyle().toUpperCase():({osu:'OSU!',taiko:'TAIKO',catch:'CATCH',mania:'MANIA'})[mode];}

function show(title,msg,button){state='menu';document.body.classList.remove('playing');$('overlay').hidden=false;$('overlay').querySelector('h1').innerHTML=title;$('message').textContent=msg;$('start').textContent=button;$('status').textContent='READY TO PLAY'}
function pause(){if(state==='play'){state='pause';$('overlay').hidden=false;$('overlay').querySelector('h1').textContent='PAUSED';$('message').textContent='Your rhythm is waiting.';$('start').textContent='▶ RESUME';$('status').textContent='PAUSED'}else if(state==='pause'){state='play';$('overlay').hidden=true;$('status').textContent='NOW PLAYING'}}
$('start').onclick=()=>state==='pause'?pause():start();$('pause').onclick=pause;$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'Sound on':'Sound off';$('sound').setAttribute('aria-pressed',String(sound))};
$('modes').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;mode=b.dataset.mode;for(const x of document.querySelectorAll('[data-mode]'))x.setAttribute('aria-pressed',String(x===b));$('help').textContent=({osu:'Z / X / Space or click circles • Esc pauses',taiko:'F / J or tap the drum when notes reach the ring',catch:'Move pointer or ← / → to catch falling fruit',mania:'D F J K or tap the matching lane',megamix:'Random mode every 8 seconds • osu!: Z / X / Space'})[mode];update()};
function osuField(){const scale=Math.min(W/512,H/384);return{scale,left:(W-512*scale)/2,top:(H-384*scale)/2}}function osuRadius(){return 38*osuField().scale}// Continuous osu! beat stream: no pauses between randomized phrases.
const osuInterval=.47,osuLead=1.1;
let demoCursor=0,demoSection=-1,demoMap=[],osuHeading=Math.random()*Math.PI*2;
function nextOsuPosition(){
 const recent=demoMap.slice(-3);
 if(!recent.length)return{x:90+Math.random()*332,y:75+Math.random()*234};
 const prev=recent[recent.length-1];let best=null,bestScore=-Infinity;
 for(let j=0;j<90;j++){
  const angle=Math.random()*Math.PI*2,distance=105+Math.random()*110;
  const x=prev.x+Math.cos(angle)*distance,y=prev.y+Math.sin(angle)*distance;
  if(x<54||x>458||y<54||y>330)continue;
  if(recent.some(p=>Math.hypot(x-p.x,y-p.y)<91))continue;
  const turn=Math.atan2(Math.sin(angle-osuHeading),Math.cos(angle-osuHeading));
  const score=-Math.abs(distance-145)/90-Math.abs(turn)/Math.PI*.24+Math.random()*.7;
  if(score>bestScore){best={x,y,angle};bestScore=score}
 }
 if(!best){
  for(let j=0;j<120;j++){
   const x=54+Math.random()*404,y=54+Math.random()*276;
   const separation=Math.min(...recent.map(p=>Math.hypot(x-p.x,y-p.y)));
   const travel=Math.hypot(x-prev.x,y-prev.y);
   if(separation>=83&&travel>=95&&travel<=260){best={x,y,angle:Math.atan2(y-prev.y,x-prev.x)};break}
  }

 if(!best){
  const options=[[70,70],[442,70],[70,314],[442,314],[256,192]];
  const point=options.sort((a,b)=>Math.min(...recent.map(p=>Math.hypot(b[0]-p.x,b[1]-p.y)))-Math.min(...recent.map(p=>Math.hypot(a[0]-p.x,a[1]-p.y))))[0];

}
function spawnOsuDemo(){

  osuHeading=Math.random()*Math.PI*2;

 const start=mode==='megamix'?section*8+.45:osuLead;

  const at=start+demoCursor*osuInterval;
  if(at-elapsed>1.35||mode==='megamix'&&at>=section*8+7.85)break;
  const p=nextOsuPosition();
  demoMap.push(p);if(demoMap.length>3)demoMap.shift();

function makeNote(){const kind=mode==='megamix'?activeStyle():mode;if(kind==='osu')return false;

function burst(x,y,c){for(let i=0;i<12;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*140;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.5,color:c})}}
function judge(n,delta){if(n.dead)return;n.dead=true;judged++;const ok=Math.abs(delta)<.19;if(ok){const quality=Math.abs(delta)<.075?300:100;hits++;combo++;score+=quality+combo*5;hp=Math.min(100,hp+2);flash=quality===300?'PERFECT':'GOOD';tone(520+combo%10*40);const p=pos(n);burst(p.x,p.y,n.color)}else{combo=0;hp=Math.max(0,hp-9);flash='MISS'}flashLife=.35;accuracy=judged?hits/judged*100:100;update();if(hp===0)show('GAME <span>OVER.</span>','Score '+score.toLocaleString()+' • '+accuracy.toFixed(1)+'% accuracy','↻ RETRY')}
function pos(n){if(noteStyle(n)==='osu'){const f=osuField();return{x:f.left+n.x*f.scale,y:f.top+n.y*f.scale}};if(noteStyle(n)==='taiko')return{x:W*.26+(n.at-elapsed)*W*.36,y:H*.52};if(noteStyle(n)==='catch')return{x:n.x*W,y:H*.82-(n.at-elapsed)*H*.45};return{x:W*.5+(n.lane-1.5)*Math.min(W*.12,85),y:H*.79-(n.at-elapsed)*H*.42}}

function hit(x,y,lane=null){if(state!=='play')return;const style=mode==='megamix'?activeStyle():mode;if(style==='catch'){catchX=Math.max(.06,Math.min(.94,x/W));return}let n;if(style==='osu'){n=nearest(q=>noteStyle(q)==='osu'&&Math.abs(elapsed-q.at)<.19?Math.hypot(pos(q).x-x,pos(q).y-y):Infinity);if(n&&Math.hypot(pos(n).x-x,pos(n).y-y)<=osuRadius()&&Math.abs(elapsed-n.at)<.19)judge(n,elapsed-n.at)}else if(style==='taiko'){n=nearest(q=>noteStyle(q)==='taiko'?Math.abs(q.at-elapsed):Infinity);if(n&&Math.abs(n.at-elapsed)<.22)judge(n,elapsed-n.at)}else{n=nearest(q=>noteStyle(q)==='mania'&&q.lane===lane?Math.abs(q.at-elapsed):Infinity);if(n&&Math.abs(n.at-elapsed)<.22)judge(n,elapsed-n.at)}}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;if((mode==='megamix'?activeStyle():mode)==='mania'){const lane=Math.max(0,Math.min(3,Math.floor((x-(W*.5-Math.min(W*.12,85)*2))/Math.min(W*.12,85))));hit(x,y,lane)}else hit(x,y)});
