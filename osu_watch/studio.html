<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>osu!watch — Pro Max Studio</title>
<link rel="stylesheet" href="/style.css">
<style>
.studio-grid{display:grid;grid-template-columns:2fr 1fr;gap:20px}
.studio-panel{background:#101827;padding:20px;border-radius:16px;margin-bottom:16px}
.studio-panel button,.studio-panel input,.studio-panel select{margin:5px;padding:8px}
.studio-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.studio-controls button{margin:0}
#program{width:100%;aspect-ratio:16/9;background:#080c1a}
.preview-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.preview-grid video{width:100%;background:#080c1a}
.studio-panel label{display:inline-block;margin:6px}
#status{font-weight:bold}
@media(max-width:800px){.studio-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><strong>◉ osu!watch</strong><nav><a href="/">Channel</a> <a href="/studio">Pro Max Studio</a></nav></header>
<main>
<h1>Pro Max Studio</h1>
<p id="status" role="status" aria-live="polite">OFF AIR — prepare your studio</p>
<div class="studio-grid">
<div>
<section class="studio-panel">
<h2>Program output</h2>
<canvas id="program" width="1280" height="720"></canvas>
<div class="studio-controls">
<button id="prepare">Prepare Studio</button>
<button id="go" disabled>Go Live</button>
<button id="stop" disabled>Stop Broadcast</button>
</div>
<p id="viewers">0 viewers</p>
<p id="stats">Not prepared</p>
</section>
<section class="studio-panel">
<h2>Sources</h2>
<div class="studio-controls">
<button id="camera">Camera</button>
<button id="screen">Share Screen</button>
<button id="pip">Screen + Camera</button>
<button id="slate">Studio Slate</button>
</div>
<div class="preview-grid">
<div><h3>Camera</h3><video id="cameraPreview" autoplay muted playsinline></video></div>
<div><h3>Screen</h3><video id="screenPreview" autoplay muted playsinline></video></div>
</div>
</section>
</div>
<div>
<section class="studio-panel">
<h2>Capture</h2>
<label>Camera <select id="cameraDevice"><option value="">System default</option></select></label>
<label>Microphone <select id="micDevice"><option value="">System default</option></select></label>
<label><input id="muteMic" type="checkbox">Mute mic</label>
<label><input id="systemAudio" type="checkbox">Include system audio</label>
<meter id="level" min="0" max="1" value="0" aria-label="Microphone level"></meter>
<label>Quality <select id="quality">
<option value="720">720p 30fps</option>
<option value="1080">1080p 30fps</option>
<option value="1080-60">1080p 60fps</option>
</select></label>
</section>
<section class="studio-panel">
<h2>Broadcast Settings</h2>
<label>Title <input id="title" value="osu!watch LIVE" maxlength="80"></label>
<label><input id="overlay" type="checkbox" checked>Show title overlay</label>
<label>Studio token <input id="token" type="password" autocomplete="off" placeholder="Optional local token"></label>
<p>For system audio, select a screen or tab and enable “Share audio” in the browser prompt.</p>
</section>
</div>
</div>
</main>
<script src="/studio.js"></script>
</body>
</html>
