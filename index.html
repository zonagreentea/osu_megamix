<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>osu!megamix — Mode Selector</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0b0d10 0%, #1a1f2e 100%);
      color: #e9eef7;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #gate-status {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #63f2b3;
      transition: background 0.3s ease;
      z-index: 1000;
    }

    #gate-status.loading { background: #ffd166; }
    #gate-status.error { background: #ff5c7a; }
    #gate-status.success { background: #63f2b3; }

    .container {
      max-width: 600px;
      padding: 40px;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 3.5em;
      margin: 0 0 10px 0;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #63f2b3, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      color: #9aa7b6;
      font-size: 0.95em;
      margin-bottom: 40px;
      letter-spacing: 0.5px;
    }

    #hub {
      display: none;
    }

    #hub.ready {
      display: block;
    }

    .modes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 30px;
    }

    .mode-btn {
      padding: 20px;
      border: 2px solid #2a3442;
      border-radius: 12px;
      background: rgba(17, 21, 27, 0.8);
      color: #e9eef7;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      display: block;
      user-select: none;
    }

    .mode-btn:hover {
      border-color: #63f2b3;
      background: rgba(99, 242, 179, 0.1);
      transform: translateY(-2px);
    }

    .mode-btn:active {
      transform: translateY(0);
    }

    #startup-error {
      display: none;
      background: rgba(255, 92, 122, 0.1);
      border: 2px solid #ff5c7a;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 30px;
    }

    #startup-error.visible {
      display: block;
      animation: shake 0.3s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    #startup-error h2 {
      margin: 0 0 10px 0;
      color: #ff5c7a;
      font-size: 1.1em;
    }

    #startup-error ul {
      margin: 0;
      padding-left: 20px;
      text-align: left;
      color: #9aa7b6;
      font-size: 0.9em;
    }

    #startup-error li {
      margin: 5px 0;
    }

    .gate-check {
      font-size: 0.85em;
      color: #9aa7b6;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #2a3442;
    }

    .check-item {
      display: inline-block;
      margin: 0 15px;
    }

    .check-item.pass::before {
      content: '✓ ';
      color: #63f2b3;
      font-weight: bold;
    }

    .check-item.fail::before {
      content: '✗ ';
      color: #ff5c7a;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="gate-status" class="loading"></div>

<div class="container">
  <h1>osu!megamix</h1>
  <div class="subtitle">a wonderful game with you in mind.</div>

  <div id="startup-error"></div>

  <div id="hub">
    <div class="modes">
      <a href="games/osu/game.html" class="mode-btn">osu!</a>
      <a href="games/taiko/game.html" class="mode-btn">Taiko</a>
      <a href="games/catch/game.html" class="mode-btn">Catch</a>
      <a href="games/mania/game.html" class="mode-btn">Mania</a>
      <a href="games/megamix/game.html" class="mode-btn">Megamix</a>
    </div>
  </div>

  <div class="gate-check" id="gate-check"></div>
</div>

<script>
/**
 * FUNCTIONAL MAIN GATE
 * Validates environment and initializes hub if all checks pass.
 */

const Gate = {
  status: {
    canvas2d: false,
    raf: false,
    audio: false,
    dom: false
  },

  checks: {
    canvas2d: () => {
      try {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        return !!ctx;
      } catch {
        return false;
      }
    },

    raf: () => typeof window.requestAnimationFrame === 'function',

    audio: () => {
      try {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        return !!AudioCtor;
      } catch {
        return false;
      }
    },

    dom: () => !!document.getElementById('hub')
  },

  validate() {
    const results = {};
    for (const [name, check] of Object.entries(this.checks)) {
      results[name] = check();
      this.status[name] = results[name];
    }
    return results;
  },

  success() {
    const gateStatus = document.getElementById('gate-status');
    gateStatus.className = 'success';

    const hub = document.getElementById('hub');
    hub.classList.add('ready');

    const gateCheckDiv = document.getElementById('gate-check');
    gateCheckDiv.innerHTML = `
      <div class="check-item pass">Canvas 2D</div>
      <div class="check-item pass">Animation API</div>
      <div class="check-item pass">Web Audio</div>
      <div class="check-item pass">DOM Ready</div>
    `;
  },

  failure(results) {
    const gateStatus = document.getElementById('gate-status');
    gateStatus.className = 'error';

    const failures = [];
    if (!results.canvas2d) failures.push('Canvas 2D context unavailable');
    if (!results.raf) failures.push('requestAnimationFrame not supported');
    if (!results.audio) failures.push('Web Audio API unavailable');
    if (!results.dom) failures.push('Hub DOM element missing');

    const errorDiv = document.getElementById('startup-error');
    errorDiv.classList.add('visible');
    errorDiv.innerHTML = `
      <h2>Cannot Start Game</h2>
      <ul>
        ${failures.map(f => `<li>${f}</li>`).join('')}
      </ul>
      <p style="margin: 10px 0 0 0; font-size: 0.85em;">
        Please use a modern browser with full HTML5 support.
      </p>
    `;

    const gateCheckDiv = document.getElementById('gate-check');
    const checks = [
      { name: 'Canvas 2D', pass: results.canvas2d },
      { name: 'Animation API', pass: results.raf },
      { name: 'Web Audio', pass: results.audio },
      { name: 'DOM Ready', pass: results.dom }
    ];
    gateCheckDiv.innerHTML = checks
      .map(c => `<div class="check-item ${c.pass ? 'pass' : 'fail'}">${c.name}</div>`)
      .join('');
  }
};

/**
 * MAIN BOOTSTRAP
 * Only runs when DOM is fully loaded.
 */
document.addEventListener('DOMContentLoaded', () => {
  const results = Gate.validate();
  const allPass = Object.values(results).every(v => v);

  if (allPass) {
    Gate.success();
  } else {
    Gate.failure(results);
  }
});
</script>

</body>
</html>
